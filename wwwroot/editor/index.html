                editor.addCommand("mySimpleCommand", {
                    //exec: function (edt) {
                    //    alert("Contenido actual:\n\n" + edt.getData());
                    //}
                    exec: function (editor) {
                        const selection = editor.getSelection();
                        const range = selection.getRanges()[0];

                        // Recorremos todos los elementos dentro del rango
                        const walker = new CKEDITOR.dom.walker(range);
                        walker.evaluator = function (node) {
                            return node.type === CKEDITOR.NODE_ELEMENT && node.getName() === 'p';
                        };

                        let found = false;

                        let node;
                        while ((node = walker.next())) {
                            node.addClass('parrafo-judicial');
                            found = true;
                        }

                        if (!found) {
                            // Si no se encontró ningún <p>, insertar uno nuevo
                            editor.insertHtml('<p class="parrafo-judicial">Texto judicial aquí...</p>');
                        } else {
                            console.log("✅ Clase aplicada a párrafos seleccionados");
                        }
                    }

                });

                            <button onclick="abrirVistaJudicial()">Aceptar</button>

                            <script>
                                function abrirVistaJudicial() {
                                    const top = document.getElementById('margenSuperior').value || '5';
                                    const bottom = document.getElementById('margenInferior').value || '2.5';
                                    const interior = document.getElementById('margenInterior').value || '5';
                                    const exterior = document.getElementById('margenExterior').value || '1.5';

                                    const vista = window.open('', '_blank');
                                    const contenido = \`${safeHtml}\`;

                                    const pageHtml = \`
                <!DOCTYPE html>
                <html>
                <head>
                            <meta charset="utf-8">
                            <title>Vista de impresión judicial</title>
                            <style>
                                body {
                                    font-family: "Times New Roman", serif;
                                    font-size: 12pt;
                                    line-height: 1.5;
                                    text-align: justify;
                                    margin: 0;
                                    padding: 0;
                                    background: white;
                                }

                                #botonImprimir {
                                    position: fixed;
                                    top: 10px;
                                    right: 10px;
                                    padding: 10px 15px;
                                    background: #007bff;
                                    color: white;
                                    border: none;
                                    cursor: pointer;
                                    font-size: 14px;
                                    z-index: 999;
                                }



                                @page {
                                    size: A4;
                                    margin-top: \${top}cm;
                                    margin-bottom: \${bottom}cm;
                                }

                                @page :left {
                                    margin-left: \${exterior}cm;
                                    margin-right: \${interior}cm;
                                }

                                @page :right {
                                    margin-left: \${interior}cm;
                                    margin-right: \${exterior}cm;
                                }

                                p {
                                    text-indent: 1.5em;
                                    margin: 0 0 1em 0;
                                }

                                .pagedjs_page {
                                    box-shadow: 0 0 8px rgba(0,0,0,0.2);
                                    margin: 8px auto;
                                    background: white;
                                }







                                @media print {
                                    #botonImprimir { display: none; }
                                }

                                .pagedjs_page {
                                    box-shadow: none !important;
                                    margin: 0 !important;
                                  }

                                  html, body {
                                    margin: 0;
                                    padding: 0;
                                  }

                            </style>
                </head>
                <body >
                            <button id="botonImprimir" onclick="window.print()">🖨 Imprimir</button>
                            <div id="contenido">\${contenido}</div>

                </body>
                </html>
                \`;

                                vista.document.open();
                                vista.document.write(pageHtml);
                                vista.document.close();


                                const script = vista.document.createElement("script");
                script.src = "https://unpkg.com/pagedjs/dist/paged.polyfill.js";
                script.onload = () => {
                  if (vista.PagedPolyfill) {
                    vista.PagedPolyfill.on("after", () => {
                      const btn = vista.document.getElementById("botonImprimir");
                      if (btn) btn.style.display = "block";
                    });
                  }
                };
                vista.document.head.appendChild(script);


                                window.close(); // Cierra la ventana de configuración
                            }
                    <\/script>
                </body>
                </html>
                `;

                        configWindow.document.open();
                        configWindow.document.write(configHtml);
                        configWindow.document.close();
                    }
                                });

                editor.on('instanceReady', function () {
                    console.log("✅ Editor listo");



                    // ⬇️ Esta función recibe HTML directamente
                    window.setEditorContent = function (html) {
                        console.log("📝 setEditorContent llamado con:", html);
                        editor.setData(html, function () {
                            console.log("✅ Contenido insertado");
                        });
                    };

                    // ⬇️ Esta función recibe HTML codificado en base64 desde MAUI
                    window.setEditorContentFromBase64 = function (base64) {
                        try {
                            const decoded = decodeURIComponent(escape(window.atob(base64)));
                            console.log("📥 HTML decodificado:", decoded);
                            window.setEditorContent(decoded);
                        } catch (err) {
                            console.error("❌ Error decodificando Base64:", err);
                        }
                    };





                    editor.commands.save.exec = function () {
                        console.log("💾 Ejecutando comando personalizado save");
                        guardarContenido();
                    };




                    if (window.chrome?.webview?.postMessage) {
                        console.log("📤 Enviando '__ready__' a MAUI");
                        window.chrome.webview.postMessage("__ready__");

                        console.log("📤 Enviando '__inicial__' a MAUI");
                        window.chrome.webview.postMessage("__inicial__");

                    }




                });









                // ⚡ Esta función se llama cuando el usuario hace clic en "Save"
                function guardarContenido() {
                    const contenido = CKEDITOR.instances.editor1.getData();
                    /*alert("✅ Se ejecutó guardarContenido()");*/
                    console.log("💾 Contenido a guardar:", contenido);

                    // MAUI: Enviar HTML a WebView2
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(contenido);
                    } else {
                        console.warn("❌ WebView2 no disponible");
                    }
                }
            }
