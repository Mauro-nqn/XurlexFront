<!-- margenes.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Configuración de márgenes</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input {
            width: 80px;
            padding: 5px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>Configuración de márgenes (en cm)</h2>
    <label>Superior: <input id="margenSuperior" type="number" value="5" step="0.1" /></label>
    <label>Inferior: <input id="margenInferior" type="number" value="2.5" step="0.1" /></label>
    <label>Interior: <input id="margenInterior" type="number" value="5" step="0.1" /></label>
    <label>Exterior: <input id="margenExterior" type="number" value="1.5" step="0.1" /></label>
    <button id="aceptarBtn">Aceptar</button>

    <script>
    window.opener.postMessage({
      tipo: "margenesConfirmados",
      datos: {
        top: document.getElementById('margenSuperior').value,
        bottom: document.getElementById('margenInferior').value,
        interior: document.getElementById('margenInterior').value,
        exterior: document.getElementById('margenExterior').value
      }
    }, "*");
    window.close();
    </script>
</body>
</html>
